<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | MAU'S GLOBAL</title>

    <meta name="description" content="Reset your MAU'S GLOBAL account password securely using your registered email address.">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">

    <style>
       
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #FAF7FC;
        }

        .login-bg {
            background: linear-gradient(135deg, #5B1A7A, #3B0F52);
        }

        .input-box:focus {
            border-color: #5B1A7A;
            outline: none;
            box-shadow: 0 0 0 3px rgba(91, 26, 122, 0.08);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="bg-white border-b border-purple-100">

        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="index.html" class="flex items-center gap-2" aria-label="MAU'S GLOBAL home">
				<img
					src="https://aghori2134.github.io/Mau-s-Global-Redesigned-Index-page/images/logo.png"
					alt="MAU'S GLOBAL logo"
					width="160"
					height="48"
					class="h-10 w-auto sm:h-12">
			</a>

            <a href="login.html"
               class="text-sm font-semibold text-[#5B1A7A] hover:text-[#FF6B57]">

                <i class="ri-arrow-left-line"></i>
                Login

            </a>

        </nav>

    </header>


    <!-- RESET PASSWORD SECTION -->
    <main class="min-h-[85vh] flex items-center justify-center px-5 py-12">

        <div class="max-w-5xl w-full grid md:grid-cols-2 bg-white rounded-3xl overflow-hidden shadow-xl border border-purple-100">


            <!-- LEFT SIDE -->
            <section class="login-bg flex flex-col justify-center p-10 md:p-14 relative overflow-hidden">	
                <div class="relative z-10">

                    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center text-white text-3xl mb-8">

                        <i class="ri-lock-password-line"></i>

                    </div>

                    <h2 class="text-4xl md:text-5xl font-bold text-white leading-tight">

                        Forgot
                        <span class="text-[#FF8B73]">Password?</span>

                    </h2>

                    <p class="text-purple-100 mt-5 leading-7 text-sm">

                        Don't worry! It happens. Enter your registered email address and we'll help you reset your password.

                    </p>

                </div>

            </section>


            <!-- RIGHT SIDE -->
            <section class="p-8 md:p-12 flex flex-col justify-center">

                <div class="mb-8">

                    <h2 class="text-2xl font-bold text-[#3B0F52]">

                        Reset Password

                    </h2>

                    <p class="text-gray-500 text-sm mt-2">

                        Enter your email address to receive a password reset link.

                    </p>

                </div>


                <!-- RESET PASSWORD FORM -->
                <form method="POST">
                    <div class="mb-6">

                        <label for="email"
                               class="block text-sm font-semibold text-gray-700 mb-2">

                            Email Address

                        </label>

                        <div class="relative">

                            <i class="ri-mail-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your registered email"
                                required
                                class="input-box w-full border border-gray-200 rounded-xl py-3.5 pl-11 pr-4 text-sm">

                        </div>

                    </div>
                    <button type="submit"
                            class="login-bg w-full text-white py-3.5 rounded-xl font-semibold hover:opacity-90 transition">

                        Send Reset Link

                        <i class="ri-arrow-right-line ml-1"></i>

                    </button>

                </form>
                <p class="text-center text-sm text-gray-500 mt-7">

                    Remember your password?

                    <a href="login.html"
                       class="font-bold text-[#5B1A7A] hover:text-[#FF6B57]">

                        Login Now

                    </a>

                </p>

            </section>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="py-5 text-center text-sm text-gray-500">

        © 2026 MAU'S GLOBAL. All Rights Reserved.

    </footer>

</body>
</html>
