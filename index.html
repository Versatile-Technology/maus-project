<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAU'S GLOBAL | Template Gallery</title>
<meta name="description" content="Choose from 10 redesigned homepage templates for MAU'S GLOBAL.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="https://aghori2134.github.io/Mau-s-Global-Redesigned-Index-page/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink: "#0F172A", mut: "#5B677D", line: "#E2E8F0", bg: "#F6F8FC" },
  fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
} } };
</script>
<style>
  :focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
  a, button { word-spacing: 0.15em; }
  .frame { position: relative; overflow: hidden; background: #fff; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="bg-bg font-sans text-ink antialiased">

<header class="border-b border-line bg-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3">
      <img src="https://aghori2134.github.io/Mau-s-Global-Redesigned-Index-page/images/logo.png" alt="MAU'S GLOBAL logo" width="140" height="40" class="h-10 w-auto">
      <span class="hidden text-sm font-semibold text-mut sm:inline">Template Gallery</span>
    </div>
    <a href="tel:+919119480496" class="rounded-full bg-ink px-5 py-2.5 text-sm font-bold text-white transition hover:bg-blue-700">Helpline +91-9119480496</a>
  </div>
</header>

<main>
  <section class="mx-auto max-w-7xl px-4 pb-6 pt-12 sm:px-6 sm:pt-16 lg:px-8">
    <h1 class="max-w-3xl text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl">Choose your homepage design</h1>
    <p class="mt-4 max-w-2xl text-lg text-mut">Same MAU'S GLOBAL content, ten different looks. Preview a design, then open it full page. Everything is responsive and ready for mobile.</p>
    <div class="mt-6 flex flex-wrap items-center gap-3" role="group" aria-label="Filter templates">
      <button type="button" data-filter="all" class="filter rounded-full bg-ink px-4 py-2 text-sm font-bold text-white">All</button>
      <button type="button" data-filter="light" class="filter rounded-full bg-white px-4 py-2 text-sm font-bold text-ink ring-1 ring-line hover:ring-ink">Light</button>
      <button type="button" data-filter="dark" class="filter rounded-full bg-white px-4 py-2 text-sm font-bold text-ink ring-1 ring-line hover:ring-ink">Dark</button>
      <span id="count" class="ml-auto text-sm font-semibold text-mut" aria-live="polite"></span>
    </div>
  </section>

  <section class="mx-auto max-w-7xl px-4 pb-20 sm:px-6 lg:px-8" aria-label="Templates">
    <ul id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></ul>
    <noscript>
      <ul class="mt-6 list-disc space-y-2 pl-6">
        <li><a class="underline" href="template-1-indigo-saffron.html">1 – Indigo &amp; Saffron</a></li>
        <li><a class="underline" href="template-2-emerald-gold.html">2 – Emerald &amp; Gold</a></li>
        <li><a class="underline" href="template-3-plum-coral.html">3 – Plum &amp; Coral</a></li>
        <li><a class="underline" href="template-4-midnight-teal.html">4 – Midnight Teal</a></li>
        <li><a class="underline" href="template-5-sky-berry.html">5 – Sky &amp; Berry</a></li>
      </ul>
    </noscript>
  </section>
</main>

<footer class="border-t border-line bg-white py-6 text-center text-sm text-mut">
  <p>© 2026 mausglobal - All Rights Reserved</p>
  <p class="mt-1">Developed By :- Versatile Technology</p>
</footer>

<script>
/* ---- EDIT HERE: set `file` to the page name when a template is ready. file:null shows "Coming soon". ---- */
const TEMPLATES = [
  { n: 1,  name: "Indigo & Saffron", file: "template-1-indigo-saffron.html", mode: "light", layout: "Classic top navigation, card grid",        colors: ["#0B2A9E", "#FF9F1C", "#EEF2FF"] },
  { n: 2,  name: "Emerald & Gold",   file: "template-2-emerald-gold.html",   mode: "light", layout: "Serif headings, image-left hero",          colors: ["#0E6B57", "#F4B63F", "#E9F7F1"] },
  { n: 3,  name: "Plum & Coral",     file: "template-3-plum-coral.html",     mode: "light", layout: "Rounded cards, arch-shaped hero image",    colors: ["#5B1A7A", "#FF6B57", "#FFF1F3"] },
  { n: 4,  name: "Midnight Teal",    file: "template-4-midnight-teal.html",  mode: "dark",  layout: "Left sidebar, bento grid, price rows",     colors: ["#0A0F1C", "#2DD4BF", "#FBBF24"] },
  { n: 5,  name: "Sky & Berry",      file: "template-5-sky-berry.html",      mode: "light", layout: "Floating nav, zig-zag services, stepper",  colors: ["#C4175F", "#2AA9E0", "#0F1F4D"] },
  { n: 6,  name: "Teal Slate",       file: "templete-6.html",     mode: "light", layout: "Light sidebar drawer, compact cards",      colors: ["#0D9488", "#F59E0B", "#F8FAFC"] },
  { n: 7,  name: "Template 7",  file: null, mode: "light", layout: "", colors: [] },
  { n: 8,  name: "Template 8",  file: null, mode: "light", layout: "", colors: [] },
  { n: 9,  name: "Template 9",  file: null, mode: "light", layout: "", colors: [] },
  { n: 10, name: "Template 10", file: null, mode: "light", layout: "", colors: [] }
];

const grid = document.getElementById('grid'), count = document.getElementById('count');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

grid.innerHTML = TEMPLATES.map(t => t.file ? `
  <li data-mode="${t.mode}" class="group overflow-hidden rounded-3xl bg-white shadow-sm ring-1 ring-line transition hover:-translate-y-1 hover:shadow-xl">
    <a href="${t.file}" class="block" aria-label="Open template ${t.n}: ${esc(t.name)}">
      <div class="frame aspect-[16/10] border-b border-line" style="background:${t.colors[0]}">
        <iframe src="${t.file}" title="Preview of ${esc(t.name)}" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
      </div>
    </a>
    <div class="p-5">
      <div class="flex items-center justify-between gap-3">
        <h2 class="text-xl font-extrabold">${t.n}. ${esc(t.name)}</h2>
        <span class="rounded-full bg-bg px-3 py-1 text-xs font-bold capitalize text-mut">${t.mode}</span>
      </div>
      <p class="mt-1 text-sm text-mut">${esc(t.layout)}</p>
      <div class="mt-3 flex gap-1.5" aria-hidden="true">${t.colors.map(c => `<span class="h-6 w-6 rounded-full ring-1 ring-black/10" style="background:${c}"></span>`).join('')}</div>
      <div class="mt-4 grid grid-cols-2 gap-2">
        <a href="${t.file}" class="rounded-xl bg-ink px-4 py-2.5 text-center text-sm font-bold text-white transition hover:bg-blue-700">Open template</a>
        <a href="${t.file}" target="_blank" rel="noopener" class="rounded-xl border-2 border-ink px-4 py-2.5 text-center text-sm font-bold transition hover:bg-ink hover:text-white">New tab ↗</a>
      </div>
    </div>
  </li>` : `
  <li data-mode="${t.mode}" data-soon class="flex min-h-[22rem] flex-col items-center justify-center rounded-3xl border-2 border-dashed border-line bg-white/60 p-6 text-center">
    <span class="flex h-14 w-14 items-center justify-center rounded-full bg-bg text-xl font-extrabold text-mut">${t.n}</span>
    <h2 class="mt-4 text-xl font-extrabold text-mut">${esc(t.name)}</h2>
    <p class="mt-1 text-sm text-mut">Coming soon</p>
  </li>`).join('');

/* scale iframes to fit their card */
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const i = f.querySelector('iframe'); if (i) i.style.transform = 'scale(' + (f.clientWidth / 1280) + ')';
  });
}
window.addEventListener('resize', fit); window.addEventListener('load', fit); fit();

/* filter */
const btns = document.querySelectorAll('.filter');
function apply(mode) {
  let shown = 0;
  grid.querySelectorAll('li').forEach(li => {
    const soon = li.hasAttribute('data-soon');
    const show = mode === 'all' ? true : (!soon && li.dataset.mode === mode);
    li.hidden = !show; if (show && !soon) shown++;
  });
  count.textContent = shown + ' template' + (shown === 1 ? '' : 's') + ' ready';
  btns.forEach(b => {
    const on = b.dataset.filter === mode;
    b.className = 'filter rounded-full px-4 py-2 text-sm font-bold ' + (on ? 'bg-ink text-white' : 'bg-white text-ink ring-1 ring-line hover:ring-ink');
    b.setAttribute('aria-pressed', on);
  });
  fit();
}
btns.forEach(b => b.addEventListener('click', () => apply(b.dataset.filter)));
apply('all');
</script>
</body>
</html>
